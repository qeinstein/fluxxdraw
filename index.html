<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>FluxxDraw</title>
    <meta
      name="description"
      content="A files-first hand-drawn whiteboard. Draw, export at up to 8K, and reopen your exports as editable drawings. No account, no cloud."
    />

    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/icon-192.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#12121a" media="(prefers-color-scheme: dark)" />
    <meta name="apple-mobile-web-app-capable" content="yes" />

    <meta property="og:title" content="FluxxDraw - Files-First Hand-Drawn Whiteboard" />
    <meta
      property="og:description"
      content="A files-first hand-drawn whiteboard. Your drawings stay on your disk. Export up to 8K and reopen exports as editable drawings."
    />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://fluxxdraw.com/" />
    <meta property="og:image" content="https://fluxxdraw.com/og-image.jpg" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="FluxxDraw - Files-First Hand-Drawn Whiteboard" />
    <meta
      name="twitter:description"
      content="A files-first hand-drawn whiteboard. Your drawings stay on your disk. Export up to 8K and reopen exports as editable drawings."
    />
    <meta name="twitter:image" content="https://fluxxdraw.com/og-image.jpg" />

    <meta name="keywords" content="whiteboard, drawing, sketch, diagram, excalidraw alternative, offline whiteboard, collaboration, yjs, p2p" />
    <link rel="canonical" href="https://fluxxdraw.com/" />

    <script>
      // Match the saved theme before first paint so the app never flashes white.
      try {
        const saved = JSON.parse(localStorage.getItem("fluxxdraw:preferences") || "{}");
        document.documentElement.dataset.theme = saved.theme === "dark" ? "dark" : "light";
      } catch {
        document.documentElement.dataset.theme = "light";
      }
    </script>
  </head>
  <body>
    <h1 style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0,0,0,0); white-space: nowrap;">
      FluxxDraw - A files-first hand-drawn whiteboard and diagramming tool
    </h1>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
